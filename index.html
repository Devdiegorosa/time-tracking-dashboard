<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main>
      <!-- Profile -->
      <section class="profile">
        <div class="profile-main">
          <div class="profile-div">
            <img
              src="images/image-jeremy.png"
              alt="Jeremy Robson's profile picture"
              class="profile-pic"
            />
            <div class="profile-info">
              <span class="report">Report for</span>
              <h1 class="name">Jeremy Robson</h1>
            </div>
          </div>
        </div>
        <div class="sub">
          <button type="button" class="btn" id="daily">Daily</button>
          <button type="button" class="btn" id="weekly">Weekly</button>
          <button type="button" class="btn" id="monthly">Monthly</button>
        </div>
      </section>
      <!-- Work -->
      <section class="work">
        <div class="work-out">
          <img src="images/icon-work.svg" alt="Work icon" class="work-icon" />
        </div>
        <div class="work-main">
          <div class="work-info">
            <span class="work-title">Work</span>
            <button class="work-menu">•••</button>
          </div>
          <div class="work-sub">
            <span class="work-hours">32hrs</span>
            <span class="work-period">Last Week - 36hrs</span>
          </div>
        </div>
      </section>
      <!-- Play -->
      <section class="play">
        <div class="play-out">
          <img src="images/icon-play.svg" alt="Play icon" class="play-icon" />
        </div>
        <div class="play-main">
          <div class="play-info">
            <span class="play-title">Play</span>
            <button class="play-menu">•••</button>
          </div>
          <div class="play-sub">
            <span class="play-hours">10hrs</span>
            <span class="play-period">Last Week - 36hrs</span>
          </div>
        </div>
      </section>
      <!-- Study -->
      <section class="study">
        <div class="study-out">
          <img src="images/icon-study.svg" alt="study icon" class="study-icon" />
        </div>
        <div class="study-main">
          <div class="study-info">
            <span class="study-title">Study</span>
            <button class="study-menu">•••</button>
          </div>
          <div class="study-sub">
            <span class="study-hours">4hrs</span>
            <span class="study-period">Last Week - 7hrs</span>
          </div>
        </div>
      </section>
      <!-- Exercise -->
      <section class="exercise">
        <div class="exercise-out">
          <img src="images/icon-exercise.svg" alt="exercise icon" class="exercise-icon" />
        </div>
        <div class="exercise-main">
          <div class="exercise-info">
            <span class="exercise-title">Exercise</span>
            <button class="exercise-menu">•••</button>
          </div>
          <div class="exercise-sub">
            <span class="exercise-hours">4hrs</span>
            <span class="exercise-period">Last Week - 7hrs</span>
          </div>
        </div>
      </section>
      <!-- Social -->
      <section class="social">
        <div class="social-out">
          <img src="images/icon-social.svg" alt="social icon" class="social-icon" />
        </div>
        <div class="social-main">
          <div class="social-info">
            <span class="social-title">Social</span>
            <button class="social-menu">•••</button>
          </div>
          <div class="social-sub">
            <span class="social-hours">5hrs</span>
            <span class="social-period">Last Week - 10hrs</span>
          </div>
        </div>
      </section>
      <!-- Self-care -->
      <section class="self-care">
        <div class="self-care-out">
          <img src="images/icon-self-care.svg" alt="self-care icon" class="self-care-icon" />
        </div>
        <div class="self-care-main">
          <div class="self-care-info">
            <span class="self-care-title">Self Care</span>
            <button class="self-care-menu">•••</button>
          </div>
          <div class="self-care-sub">
            <span class="self-care-hours">2hrs</span>
            <span class="self-care-period">Last Week - 2hrs</span>
          </div>
        </div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
